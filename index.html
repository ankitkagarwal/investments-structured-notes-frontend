<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <title>Structured Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Structured Notes</h1>
    <p id="env" class="muted"></p>

    <p id="viewLoading" class="muted">Loading...</p>

    <section id="viewEmail" hidden>
      <form id="emailForm" novalidate>
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" maxlength="254">
        <button id="sendBtn" type="submit">Send code</button>
      </form>
    </section>

    <section id="viewCode" hidden>
      <p id="codeHint" class="muted"></p>
      <form id="codeForm" novalidate>
        <label for="code">6-digit code</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        <button id="verifyBtn" type="submit">Sign in</button>
      </form>
      <button id="resendBtn" type="button" class="link" disabled>Send a new code</button>
      <button id="backBtn" type="button" class="link">Use a different email</button>
    </section>

    <section id="viewHome" hidden>
      <p id="whoami"></p>
      <p class="tasksline">Open tasks <span id="taskBadge" class="badge" title="">...</span></p>
      <button id="logoutBtn" type="button">Sign out</button>
    </section>

    <p id="msg" role="status"></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
